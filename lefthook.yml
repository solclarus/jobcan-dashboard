pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    format:
      run: bun run format:check

pre-push:
  parallel: true
  commands:
    typecheck:
      skip:
        - merge
        - rebase
      run: bun run tsc
    build:
      skip:
        - merge
        - rebase
      run: bun run build
